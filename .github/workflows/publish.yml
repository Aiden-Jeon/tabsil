# Publish the tabsil package (the inference package; not tabsil-train) to PyPI with trusted
# publishing (OIDC, no API token). Runs when a GitHub release is published, or by hand for an
# existing release tag:
#   gh workflow run publish.yml -f tag=v0.1.0
# PyPI side (once): the project's trusted publisher is this repository, workflow `publish.yml`,
# environment `pypi`. The built files are also attached to the GitHub release, so the release and
# PyPI hold the same files.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.1.0)
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Build sdist and wheel
        run: uv build --package tabsil --out-dir dist
      - name: Check the files match the tag version and leave out tabsil-train
        run: |
          version="${TAG#v}"
          ls dist
          test "$(ls dist | wc -l)" -eq 2
          test -f "dist/tabsil-${version}-py3-none-any.whl"
          test -f "dist/tabsil-${version}.tar.gz"
          ! unzip -l "dist/tabsil-${version}-py3-none-any.whl" | grep -q tabsil_train
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tabsil/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Publish
        run: uv publish --trusted-publishing always dist/*

  release-files:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the files to the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Attach the published files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
