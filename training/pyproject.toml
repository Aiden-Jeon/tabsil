[project]
name = "tabsil-train"
version = "0.1.0"
description = "Training, synthetic priors and benchmark evaluation of the TabSil tabular foundation model"
license = "Apache-2.0"
# copies of the root LICENSE and a NOTICE (uv_build does not accept paths outside this folder)
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Aiden-Jeon", email = "aiden.jongseob@gmail.com" }
]
requires-python = ">=3.11"
# Lower bounds follow Databricks Serverless GPU environment v6 (the training and evaluation jobs
# in scripts/*.yaml run there); torch comes with tabsil (the workspace lock keeps the 2.11 build
# tested there).
# pandas comes with tabsil (>=2.2) and is raised to >=3.0.6 in the dev group; the arena extra's
# tabarena (autogluon) needs pandas<2.4, so that install gets 2.3 (tool.uv.conflicts in the
# workspace root pyproject.toml).
dependencies = [
    "tabsil",
    "matplotlib>=3.10",
    "mlflow>=2.15",
    "openml>=0.15",
    "scipy>=1.16",
    "tabicl>=2.2",
    "tqdm>=4.67",
]

[project.optional-dependencies]
# TabArena / BeyondArena evaluation (tabsil_train.benchmarks.arena); tabarena and autogluon are
# pre-releases
arena = [
    "tabarena[data-foundry]>=0.1.1.dev20261031",
]
# fev-bench forecasting evaluation (tabsil_train.benchmarks.fevbench): the fev package that
# defines the tasks, windows and metrics (it brings `datasets` for the HF data)
fev = [
    "fev==0.10.0",
]
# treatment effect evaluation (tabsil_train.benchmarks.causal): the EconML baselines run on the
# same splits (causal forest, GBM-based S/T/X/DR-learners)
causal = [
    "econml==0.17.1",
]

[tool.uv.sources]
tabsil = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
# test and lint tools (`uv sync --package tabsil-train` installs this group; the root project's
# dev group is not installed with --package)
dev = [
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "python-dotenv>=1.2",
    "ruff>=0.16.8",
]
# dev tools to use with the arena extra (it cannot be installed with dev because of pandas):
#   uv sync --package tabsil-train --no-dev --extra arena --group arena-dev
arena-dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
