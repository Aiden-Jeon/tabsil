# TabSil benchmark evaluation (training/scripts/eval.py) on Databricks AI Runtime: AMLB
# classification (29) and AMLB/CTR23 regression (28), 10-fold cross-validation per OpenML task. The
# ensemble member count and preprocessing come from the model (`tabsil.recipe.default_inference`).
# From the repository root:
#   databricks air run -f training/scripts/eval.yaml --watch --override mlflow_experiment_directory=$MLFLOW_EXPERIMENT_DIR \
#     --override "env_variables.TABSIL_EXTRA_ARGS=--classifier-path runs:/<run_id>/checkpoints/step_0005000.pt \
#       --regressor-path runs:/<run_id>/checkpoints/step_0005000.pt"
# A checkpoint is a file, a runs:/ URI or a Hub repo (hf://owner/name). TABSIL_SUITE picks the
# suite (all, classification, regression, dev); `--uncertainty` in TABSIL_EXTRA_ARGS adds the
# predictive distribution metrics.
#
# ADBench unsupervised outlier detection (12 tables x 3 seeds, `--suite adbench`): TabSil's
# chain-rule log density (tabsil.unsupervised) on the contaminated training rows, its `+clean`
# diagnostic and IsolationForest (the split check). One (table, split, method) job per GPU from a
# queue (`--shards`); with 8 GPUs set compute to GPU_8xH100 with 8 accelerators:
#   databricks air run -f training/scripts/eval.yaml --watch --override mlflow_experiment_directory=$MLFLOW_EXPERIMENT_DIR \
#     --override "mlflow_run_name=tabsil-v1-eval-adbench" --override "env_variables.TABSIL_SUITE=adbench" \
#     --override "compute.accelerator_type=GPU_8xH100" --override "compute.num_accelerators=8" \
#     --override "env_variables.TABSIL_EXTRA_ARGS=--regressor-path hf://aiden-jeon/tabsil@v1 --shards 8"
experiment_name: tabsil
mlflow_run_name: tabsil-v1-eval
environment:
  version: databricks_ai_v6
  dependencies:
    - openml>=0.15
    - huggingface-hub>=0.34
compute:
  accelerator_type: GPU_1xH100
  num_accelerators: 1
code_source:
  type: snapshot
  snapshot:
    # the two packages (tabsil, tabsil-train, imported through PYTHONPATH) and the script, relative
    # to the repository root
    root_path: ../..
    include_paths:
      - src
      - training/src
      - training/scripts/eval.py
env_variables:
  TABSIL_SUITE: all
  TABSIL_EXTRA_ARGS: ""
max_retries: 0
timeout_minutes: 240
command: >-
  PYTHONPATH=$CODE_SOURCE_PATH/src:$CODE_SOURCE_PATH/training/src
  python $CODE_SOURCE_PATH/training/scripts/eval.py --suite $TABSIL_SUITE $TABSIL_EXTRA_ARGS
