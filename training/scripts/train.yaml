# TabSil training (training/scripts/train.py) on Databricks AI Runtime: one multitask model
# (classification and regression, alternating per step) on the graph SCM prior, trained with the
# TabICLv2-style 3-stage curriculum of `tabsil_train.recipe` (from the repository root):
#   databricks air run -f training/scripts/train.yaml --watch --override mlflow_experiment_directory=$MLFLOW_EXPERIMENT_DIR
# The default is a short timing run (stage 1, 300 steps, 8xH100). Change the scale with overrides:
#   curriculum:   --override env_variables.TABSIL_CONFIG_NAME=stage1 --override env_variables.TABSIL_STEPS=250000 \
#                 --override mlflow_run_name=tabsil-v1-stage1
#                 stage 2 and 3 start from the previous stage's run:
#                 --override env_variables.TABSIL_CONFIG_NAME=stage2 --override env_variables.TABSIL_STEPS=20000 \
#                 --override env_variables.TABSIL_INIT_RUN_ID=<run_id> --override env_variables.TABSIL_INIT_STEP=<step>
#                 (TABSIL_STEPS replaces the stage's step count, so give the stage's own count)
#   chunks:       --override env_variables.TABSIL_STOP_STEP=<end of this chunk> --override timeout_minutes=<estimate>
#   resume:       --override env_variables.TABSIL_RESUME_RUN_ID=<run_id>
#   prior:        --override env_variables.TABSIL_PRIOR_TYPE=graph_scm_hicard_missing (default graph_scm)
#   GPU memory:   --override env_variables.TABSIL_MICRO_BATCH=<datasets per GPU>
#   more nodes:   --override compute.num_accelerators=32 --override env_variables.TABSIL_BATCH_SIZE=256
#                 (the curriculum's batch 256 is for 32 GPUs; resuming keeps the original run's batch)
#   Muon:         --override env_variables.TABSIL_MUON_DISTRIBUTED=all (Newton-Schulz split over the GPUs,
#                 same results and checkpoint format; `node` splits within a node, `off` turns it off)
#   diagnostics:  --override env_variables.TABSIL_GRAD_COSINE=1, --override env_variables.TABSIL_RANK_TIMING=1
# Other variables are listed in the training/scripts/train.py docstring. PYTHONHASHSEED=0 fixes the
# prior's table order (the tabicl prior iterates a set of strings).
experiment_name: tabsil
mlflow_run_name: tabsil-v1-timing-300steps-8gpu
environment:
  # AI v6: Python 3.12, torch 2.11.0+cu130. The job runs on this environment's torch, not on
  # uv.lock; the workspace lock keeps the same torch (tool.uv.constraint-dependencies in
  # pyproject.toml), so change both together
  version: databricks_ai_v6
  # Not in the base environment: the TabICL prior that generates the training data
  dependencies:
    - tabicl>=2.2
compute:
  accelerator_type: GPU_8xH100
  num_accelerators: 8
code_source:
  type: snapshot
  snapshot:
    # Upload only the two packages (tabsil, tabsil-train) and the training script, relative to the
    # repository root. They are imported from the snapshot (PYTHONPATH), not installed
    root_path: ../..
    include_paths:
      - src
      - training/src
      - training/scripts/train.py
env_variables:
  TABSIL_CONFIG_NAME: stage1
  TABSIL_STEPS: "300"
  # Prior generation workers per GPU. Match the node's CPU count
  TABSIL_NUM_WORKERS: "8"
max_retries: 0
timeout_minutes: 60
# Multi-node launch, expandable_segments, fixed hash seed
command: >-
  PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  PYTHONHASHSEED=0
  PYTHONPATH=$CODE_SOURCE_PATH/src:$CODE_SOURCE_PATH/training/src
  torchrun $(if [ "${NUM_NODES:-1}" -gt 1 ]; then
  echo --nnodes=$NUM_NODES --node_rank=$NODE_RANK --master_addr=$MASTER_ADDR --master_port=$MASTER_PORT;
  else echo --standalone; fi)
  --nproc_per_node=8 $CODE_SOURCE_PATH/training/scripts/train.py
